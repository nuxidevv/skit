<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0a0f;
    --card:rgba(22,22,30,0.6);
    --card-solid:#12121a;
    --card-hover:rgba(30,30,42,0.75);
    --border:rgba(255,255,255,0.08);
    --border-hover:rgba(255,255,255,0.2);
    --text:#f0f0f5;
    --text-dim:#8888a0;
    --text-dimmer:#4a4a5a;
    --green:#a855f7;
    --green-dim:rgba(168,85,247,0.15);
    --orange:#f59e0b;
    --orange-dim:rgba(245,158,11,0.12);
    --red:#ef4444;
    --blue:#3b82f6;
    --purple:#a855f7;
    --cyan:#22d3ee;
    --input-bg:rgba(18,18,26,0.6);
    --row-border:rgba(255,255,255,0.06);
    --glow:rgba(168,85,247,0.25);
    --glass-tint:rgba(22,22,30,0.5);
    --glass-highlight:rgba(255,255,255,0.08);
    --glass-shadow:rgba(0,0,0,0.5);
    --btn-bg:linear-gradient(180deg, rgba(168,85,247,0.9) 0%, rgba(139,92,246,0.85) 100%);
    --btn-border:rgba(168,85,247,0.5);
    --btn-text:#fff;
    --btn-highlight:rgba(255,255,255,0.3);
    --nav-shine:rgba(168,85,247,0.12);
  }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh; overflow-x:hidden;
    transition:background 0.4s, color 0.4s, padding-top 0.4s;
    -webkit-font-smoothing:antialiased;
    padding-top:80px;
    position:relative;
  }
  body.modal-open { overflow:hidden; }

  body::after {
    content:''; position:fixed; inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.15) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 40%, rgba(255,255,255,0.12) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.08) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 90% 30%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 90%, rgba(255,255,255,0.06) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 10%, rgba(255,255,255,0.1) 0%, transparent 100%);
    pointer-events:none; z-index:0;
  }

  #particles {
    position:fixed; inset:0;
    z-index:0; pointer-events:none;
    opacity:0.6;
  }

  body::before {
    content:''; position:fixed; top:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:1400px; height:900px;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(168,85,247,0.22) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 10%, rgba(59,130,246,0.15) 0%, transparent 55%),
      radial-gradient(ellipse at top, rgba(168,85,247,0.18) 0%, rgba(59,130,246,0.08) 40%, transparent 70%);
    pointer-events:none; z-index:0;
    animation:heroGlow 8s ease-in-out infinite;
    filter:blur(20px);
  }
  @keyframes heroGlow {
    0%,100% { opacity:0.8; transform:translateX(-50%) scale(1); }
    50% { opacity:1; transform:translateX(-50%) scale(1.08); }
  }

  .progress-bar {
    position:fixed; top:0; left:0; height:2px; width:0%;
    background:linear-gradient(90deg, var(--purple), var(--blue));
    z-index:100; transition:width 0.3s ease-out, opacity 0.3s;
    opacity:0; box-shadow:0 0 12px rgba(168,85,247,0.6);
  }
  .progress-bar.active { opacity:1; }

  nav.topbar {
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    z-index:60;
    max-width:calc(1400px - 32px);
    width:calc(100% - 32px);
    padding:10px 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:100px;
    background:linear-gradient(135deg, rgba(30,30,45,0.55) 0%, rgba(18,18,28,0.65) 100%);
    backdrop-filter:blur(48px) saturate(240%) brightness(1.1);
    -webkit-backdrop-filter:blur(48px) saturate(240%) brightness(1.1);
    border:1px solid rgba(255,255,255,0.14);
    box-shadow:
      0 12px 48px rgba(0,0,0,0.55),
      0 0 0 0.5px rgba(255,255,255,0.08) inset,
      0 1px 0 0 rgba(255,255,255,0.18) inset,
      0 -1px 0 0 rgba(0,0,0,0.25) inset,
      0 0 60px rgba(168,85,247,0.12);
    transition:all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    overflow:hidden;
  }
  nav.topbar::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:55%;
    background:linear-gradient(180deg,
      rgba(255,255,255,0.18) 0%,
      rgba(255,255,255,0.05) 40%,
      transparent 100%);
    border-radius:100px 100px 0 0;
    pointer-events:none;
    opacity:0.95;
  }
  nav.topbar::after {
    content:'';
    position:absolute;
    top:0; left:-100%;
    width:70%; height:100%;
    background:linear-gradient(90deg,
      transparent 0%,
      rgba(255,255,255,0.12) 45%,
      rgba(168,85,247,0.15) 50%,
      rgba(255,255,255,0.12) 55%,
      transparent 100%);
    transition:left 1s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events:none;
    filter:blur(8px);
  }
  nav.topbar:hover::after { left:200%; }

  .brand {
    display:flex; align-items:center; gap:10px;
    font-weight:800; font-size:1.05rem; letter-spacing:-0.02em;
    cursor:default;
    position:relative;
    z-index:2;
  }
  .brand-mark {
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    box-shadow:
      0 4px 20px rgba(168,85,247,0.5),
      0 0 0 1px rgba(255,255,255,0.15) inset,
      0 1px 0 0 rgba(255,255,255,0.4) inset;
    transition:transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .brand:hover .brand-mark { transform:rotateY(180deg) scale(1.05); }
  .brand-mark::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
    animation:shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { transform:translateX(-100%); }
    100% { transform:translateX(100%); }
  }
  .brand-mark svg { width:15px; height:15px; color:#fff; position:relative; z-index:1; }

  .maintenance-banner {
    position:fixed;
    top:72px;
    left:50%;
    transform:translateX(-50%);
    z-index:55;
    max-width:calc(1400px - 32px);
    width:calc(100% - 32px);
    padding:10px 16px;
    border-radius:18px;
    background:linear-gradient(135deg,
      rgba(245,158,11,0.15) 0%,
      rgba(239,68,68,0.18) 50%,
      rgba(245,158,11,0.15) 100%);
    border:1px solid rgba(245,158,11,0.45);
    backdrop-filter:blur(48px) saturate(240%) brightness(1.1);
    -webkit-backdrop-filter:blur(48px) saturate(240%) brightness(1.1);
    box-shadow:
      0 12px 48px rgba(0,0,0,0.5),
      0 0 0 0.5px rgba(255,255,255,0.08) inset,
      0 1px 0 0 rgba(255,255,255,0.2) inset,
      0 -1px 0 0 rgba(0,0,0,0.15) inset,
      0 4px 32px rgba(245,158,11,0.25);
    animation:maintSlide 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    overflow:hidden;
  }
  .maintenance-banner::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:55%;
    background:linear-gradient(180deg,
      rgba(255,255,255,0.14) 0%,
      transparent 100%);
    pointer-events:none;
  }
  @keyframes maintSlide {
    from { transform:translateX(-50%) translateY(-140%); opacity:0; }
    to { transform:translateX(-50%) translateY(0); opacity:1; }
  }
  .maintenance-content {
    max-width:1400px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    position:relative;
    z-index:2;
  }
  .maintenance-icon {
    width:24px; height:24px;
    border-radius:8px;
    background:linear-gradient(135deg, rgba(245,158,11,0.35) 0%, rgba(239,68,68,0.25) 100%);
    border:1px solid rgba(245,158,11,0.55);
    color:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow:
      0 4px 12px rgba(245,158,11,0.25),
      0 1px 0 0 rgba(255,255,255,0.3) inset;
    animation:maintPulse 2.5s ease-in-out infinite;
  }
  .maintenance-icon svg { width:13px; height:13px; }
  @keyframes maintPulse {
    0%,100% { box-shadow:0 4px 12px rgba(245,158,11,0.25), 0 0 0 0 rgba(245,158,11,0.4), 0 1px 0 0 rgba(255,255,255,0.3) inset; }
    50% { box-shadow:0 4px 12px rgba(245,158,11,0.25), 0 0 0 8px rgba(245,158,11,0), 0 1px 0 0 rgba(255,255,255,0.3) inset; }
  }
  .maintenance-text {
    font-size:0.75rem;
    line-height:1.5;
    color:var(--text-dim);
    letter-spacing:0.01em;
  }
  .maintenance-text strong {
    color:var(--orange);
    font-weight:700;
    margin-right:4px;
  }

  body.has-maintenance { padding-top:150px; }

  main { position:relative; z-index:1; }
  .container { max-width:900px; margin:0 auto; padding:0 24px; }

  section.hero {
    padding:20px 24px 60px;
    text-align:center;
    position:relative;
  }

  .badges-row {
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:8px; margin-bottom:28px;
    animation:fadeUp 0.8s ease-out 0.1s backwards;
  }

  .badge {
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; border-radius:100px;
    background:linear-gradient(135deg, rgba(30,30,45,0.6) 0%, rgba(18,18,28,0.7) 100%);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(40px) saturate(220%) brightness(1.08);
    -webkit-backdrop-filter:blur(40px) saturate(220%) brightness(1.08);
    font-size:0.7rem; font-weight:500; color:var(--text-dim);
    transition:all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    position:relative;
    overflow:hidden;
    box-shadow:
      0 8px 24px rgba(0,0,0,0.4),
      0 0 0 0.5px rgba(255,255,255,0.06) inset,
      0 1px 0 0 rgba(255,255,255,0.15) inset,
      0 -1px 0 0 rgba(0,0,0,0.15) inset;
  }
  .badge::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:55%;
    background:linear-gradient(180deg, rgba(255,255,255,0.14) 0%, transparent 100%);
    pointer-events:none;
    border-radius:100px 100px 0 0;
  }
  .badge:hover {
    border-color:rgba(255,255,255,0.25);
    transform:translateY(-2px);
    box-shadow:
      0 12px 32px var(--glow),
      0 0 0 0.5px rgba(255,255,255,0.1) inset,
      0 1px 0 0 rgba(255,255,255,0.2) inset;
  }
  .badge .dot {
    width:5px; height:5px; border-radius:50%;
    background:var(--purple); box-shadow:0 0 6px var(--purple);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.8); }
  }

  h1.hero-title {
    font-size:clamp(1.8rem, 5vw, 3rem);
    font-weight:800; letter-spacing:-0.035em;
    line-height:1.1; margin-bottom:20px;
    color:var(--text);
    animation:fadeUp 0.8s ease-out 0.2s backwards;
  }
  h1.hero-title .accent {
    background:linear-gradient(135deg, var(--purple) 0%, var(--blue) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    display:inline-block;
  }
  .typewriter {
    display:inline-block;
    vertical-align:baseline;
    min-width:1ch;
    color:var(--text);
  }
  .typewriter .grad {
    background:linear-gradient(135deg, var(--purple) 0%, var(--blue) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }
  .cursor {
    display:inline-block;
    width:3px;
    height:0.9em;
    background:var(--purple);
    margin-left:3px;
    vertical-align:-0.05em;
    border-radius:2px;
    box-shadow:0 0 10px var(--purple), 0 0 20px rgba(168,85,247,0.4);
    animation:blinkCursor 1s step-end infinite;
  }
  @keyframes blinkCursor {
    0%, 50% { opacity:1; }
    51%, 100% { opacity:0; }
  }

  .hero-sub {
    font-size:0.95rem; color:var(--text-dim);
    max-width:600px; margin:0 auto 40px;
    line-height:1.6; font-weight:400;
    animation:fadeUp 0.8s ease-out 0.3s backwards;
  }

  .search-container {
    max-width:640px; margin:0 auto;
    animation:fadeUp 0.8s ease-out 0.4s backwards;
  }

  .input-wrap {
    position:relative;
    margin-bottom:12px;
    transition:transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .input-wrap:focus-within { transform:scale(1.01); }
  .input-wrap .input-icon {
    position:absolute; left:16px; top:50%;
    transform:translateY(-50%);
    width:18px; height:18px;
    color:var(--text-dimmer);
    pointer-events:none;
    transition:color 0.2s, transform 0.3s;
    z-index:2;
  }
  .input-wrap:focus-within .input-icon {
    color:var(--purple);
    transform:translateY(-50%) scale(1.15) rotate(15deg);
  }

  input#target {
    background:linear-gradient(135deg, rgba(30,30,45,0.55) 0%, rgba(18,18,28,0.7) 100%);
    border:1px solid rgba(255,255,255,0.12);
    color:var(--text);
    padding:18px 46px 18px 46px;
    border-radius:16px;
    font-size:0.95rem;
    font-family:inherit;
    outline:none; width:100%;
    transition:all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    position:relative; z-index:1;
    backdrop-filter:blur(48px) saturate(240%) brightness(1.08);
    -webkit-backdrop-filter:blur(48px) saturate(240%) brightness(1.08);
    box-shadow:
      0 12px 40px rgba(0,0,0,0.5),
      0 0 0 0.5px rgba(255,255,255,0.06) inset,
      0 1px 0 0 rgba(255,255,255,0.18) inset,
      0 -1px 0 0 rgba(0,0,0,0.2) inset;
  }
  input#target::placeholder { color:var(--text-dimmer); }
  input#target:focus {
    border-color:rgba(255,255,255,0.28);
    box-shadow:
      0 0 0 4px var(--glow),
      0 16px 56px rgba(0,0,0,0.55),
      0 0 0 0.5px rgba(255,255,255,0.12) inset,
      0 1px 0 0 rgba(255,255,255,0.28) inset,
      0 0 60px rgba(168,85,247,0.25);
    background:linear-gradient(135deg, rgba(40,40,60,0.65) 0%, rgba(25,25,40,0.8) 100%);
  }

  .input-type-badge {
    position:absolute; right:44px; top:50%;
    transform:translateY(-50%);
    font-size:0.6rem; font-weight:700;
    padding:3px 8px; border-radius:100px;
    background:var(--green-dim); color:var(--purple);
    border:1px solid var(--glow);
    letter-spacing:0.05em; text-transform:uppercase;
    font-family:'JetBrains Mono', monospace;
    display:none;
    z-index:2;
    pointer-events:none;
    transition:opacity 0.2s;
  }
  .input-type-badge.visible { display:inline-block; }

  .input-clear {
    position:absolute; right:14px; top:50%;
    transform:translateY(-50%);
    width:24px; height:24px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    display:none; align-items:center; justify-content:center;
    cursor:pointer; z-index:3;
    transition:all 0.15s;
    backdrop-filter:blur(40px) saturate(220%);
    -webkit-backdrop-filter:blur(40px) saturate(220%);
    box-shadow:
      0 1px 0 0 rgba(255,255,255,0.2) inset,
      0 4px 12px rgba(0,0,0,0.3);
  }
  .input-clear:hover {
    background:rgba(255,255,255,0.16);
    transform:translateY(-50%) scale(1.1);
    border-color:rgba(255,255,255,0.3);
  }
  .input-clear.visible { display:flex; }
  .input-clear svg { width:10px; height:10px; color:var(--text-dim); }

  button.primary {
    width:100%;
    background:linear-gradient(180deg,
      rgba(180,120,250,0.95) 0%,
      rgba(140,95,245,0.9) 50%,
      rgba(120,80,230,0.9) 100%);
    color:var(--btn-text);
    border:1px solid rgba(200,160,255,0.6);
    padding:18px;
    border-radius:16px;
    font-size:0.92rem; font-weight:700;
    cursor:pointer; font-family:inherit;
    letter-spacing:0.01em;
    transition:all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    position:relative; overflow:hidden;
    backdrop-filter:blur(40px) saturate(220%);
    -webkit-backdrop-filter:blur(40px) saturate(220%);
    box-shadow:
      0 12px 40px rgba(168,85,247,0.4),
      0 0 0 0.5px rgba(255,255,255,0.15) inset,
      0 1px 0 0 rgba(255,255,255,0.45) inset,
      0 -1px 0 0 rgba(0,0,0,0.15) inset,
      0 0 60px rgba(168,85,247,0.3);
    text-shadow:0 1px 2px rgba(0,0,0,0.2);
  }
  button.primary::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:55%;
    background:linear-gradient(180deg,
      rgba(255,255,255,0.4) 0%,
      rgba(255,255,255,0.08) 60%,
      transparent 100%);
    border-radius:16px 16px 0 0;
    pointer-events:none;
  }
  button.primary:hover:not(:disabled) {
    transform:translateY(-3px) scale(1.015);
    box-shadow:
      0 20px 60px rgba(168,85,247,0.55),
      0 0 0 0.5px rgba(255,255,255,0.2) inset,
      0 1px 0 0 rgba(255,255,255,0.55) inset,
      0 -1px 0 0 rgba(0,0,0,0.15) inset,
      0 0 80px rgba(168,85,247,0.5);
  }
  button.primary:active:not(:disabled) {
    transform:translateY(0) scale(0.99);
  }
  button.primary:disabled {
    background:rgba(30,30,45,0.5);
    color:var(--text-dimmer);
    cursor:default;
    border-color:rgba(255,255,255,0.08);
    box-shadow:none;
  }
  button.primary .spinner {
    display:none; width:14px; height:14px;
    border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff;
    border-radius:50%; animation:
