<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Seek It — Fin de l'aventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #000000;
    --surface: #0a0a0c;
    --surface-2: #111114;
    --border: #1e1e24;
    --border-strong: #2a2a32;
    --text: #ececed;
    --text-2: #a0a0a8;
    --text-3: #6a6a72;
    --accent: #00c46a;
    --discord: #5865F2;
    --discord-hover: #4752c4;
    --radius-pill: 100px;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', -apple-system, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== CANVAS PARTICULES ===== */
  #particleCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.6;
  }

  /* ===== LAYOUT PRINCIPAL ===== */
  .wrapper {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    overflow-y: auto;
  }

  /* ===== LOGO / HEADER ===== */
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: -0.01em;
    color: var(--text-3);
    margin-bottom: 40px;
    animation: fadeInDown 0.8s ease-out;
  }
  
  /* Modification ici pour l'image */
  .brand-logo {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    object-fit: cover;
    border: 1px solid var(--border-strong);
  }

  /* ===== CONTENU ===== */
  h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.15;
    margin-bottom: 24px;
    animation: fadeInUp 0.8s ease-out 0.1s backwards;
  }
  h1 .strike {
    text-decoration: line-through;
    color: var(--text-3);
    opacity: 0.5;
  }
  h1 .accent {
    color: var(--accent);
  }

  .subtitle {
    font-size: clamp(0.9rem, 2vw, 1.05rem);
    color: var(--text-2);
    max-width: 480px;
    line-height: 1.6;
    margin-bottom: 56px;
    animation: fadeInUp 0.8s ease-out 0.2s backwards;
  }

  /* ===== ALTERNATIVES ===== */
  .alternatives {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-bottom: 56px;
    animation: fadeInUp 0.8s ease-out 0.3s backwards;
  }
  .alt-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: var(--mono);
  }
  .alt-links {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .alt-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--border-strong);
    transition: all 0.3s ease;
    position: relative;
  }
  .alt-link::after {
    content: '↗';
    font-size: 0.9rem;
    color: var(--text-3);
    transition: transform 0.3s ease, color 0.3s ease;
  }
  .alt-link:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
    padding-bottom: 8px;
    padding-top: 16px;
  }
  .alt-link:hover::after {
    transform: translate(2px, -2px);
    color: var(--accent);
  }

  /* ===== BOUTON DISCORD ===== */
  .discord-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 32px;
    background: transparent;
    color: #fff;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-pill);
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    animation: fadeInUp 0.8s ease-out 0.4s backwards;
  }
  .discord-btn svg {
    width: 20px;
    height: 20px;
    color: var(--text-2);
    transition: color 0.3s ease;
  }
  .discord-btn:hover {
    background: var(--discord);
    border-color: var(--discord);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(88,101,242,0.3);
  }
  .discord-btn:hover svg {
    color: #fff;
  }

  /* ===== FOOTER ===== */
  .footer {
    position: absolute;
    bottom: 24px;
    font-size: 0.75rem;
    color: var(--text-3);
    font-family: var(--mono);
    animation: fadeIn 1s ease-out 0.6s backwards;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ===== MOBILE ===== */
  @media (max-width: 640px) {
    .brand { margin-bottom: 32px; }
    .subtitle { margin-bottom: 40px; }
    .alternatives { margin-bottom: 40px; }
    .alt-links { flex-direction: column; width: 100%; max-width: 240px; }
    .alt-link { justify-content: center; }
    .footer { position: relative; bottom: auto; margin-top: 60px; }
    .wrapper { justify-content: flex-start; padding-top: 80px; padding-bottom: 40px; }
  }
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="wrapper">
  <!-- Logo en haut (MODIFIÉ ICI) -->
  <div class="brand">
    <img src="IMG_0608.png" alt="Seek It Logo" class="brand-logo">
    <span>Seek It</span>
  </div>

  <!-- Titre principal -->
  <h1>Seek It a fermé<br><span class="strike">ses portes</span> définitivement.</h1>

  <!-- Sous-titre -->
  <p class="subtitle">
    Après une belle aventure, l'équipe Seek It a décidé de tourner la page pour se concentrer sur de nouveaux horizons. Merci à tous ceux qui nous ont suivis.
  </p>

  <!-- Alternatives -->
  <div class="alternatives">
    <span class="alt-label">Découvrez nos autres projets</span>
    <div class="alt-links">
      <a href="https://vortex-searcher.vercel.app" target="_blank" rel="noopener noreferrer" class="alt-link">Vortex</a>
      <a href="https://lynx-search.vercel.app" target="_blank" rel="noopener noreferrer" class="alt-link">Lynx</a>
    </div>
  </div>

  <!-- Bouton Discord -->
  <a href="https://discord.gg/fxr7BFbPNc" target="_blank" rel="noopener noreferrer" class="discord-btn">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>

    Rejoindre le Discord
  </a>

  <!-- Footer -->
  <div class="footer">
    © 2026 — L'équipe Seek It
  </div>
</div>

<script>
  /* ===== PARTICULES QUI TOMBENT ===== */
  (function fallingParticles() {
    const canvas = document.getElementById("particleCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d", { alpha:true });

    let w, h, dpr;
    let particles = [];
    let rafId = null;
    const COUNT = 60;
    const SPEED_MIN = 0.15;
    const SPEED_MAX = 0.4;
    const SIZE_MIN = 0.5;
    const SIZE_MAX = 1.4;
    const COLOR = "170, 170, 180";

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function createParticle(atTop) {
      return {
        x: Math.random() * w,
        y: atTop ? (Math.random() * -50 - 10) : Math.random() * h,
        r: Math.random() * (SIZE_MAX - SIZE_MIN) + SIZE_MIN,
        vy: Math.random() * (SPEED_MAX - SPEED_MIN) + SPEED_MIN,
        vx: (Math.random() - 0.5) * 0.1,
        a: Math.random() * 0.3 + 0.1
      };
    }

    function init() {
      particles = [];
      for (let i = 0; i < COUNT; i++) particles.push(createParticle(false));
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.y > h + 10) {
          particles[i] = createParticle(true);
          continue;
        }
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${COLOR}, ${p.a})`;
        ctx.fill();
      }
      rafId = requestAnimationFrame(draw);
    }

    function start() { if (rafId === null) rafId = requestAnimationFrame(draw); }
    function stop() { if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } }

    resize();
    init();
    window.addEventListener("resize", () => { resize(); init(); });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stop();
      else start();
    });
    window.addEventListener("pageshow", () => start());
    start();
  })();
</script>
