<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seek It — On revient.</title>
<meta name="description" content="Seek It est temporairement en maintenance. Nous revenons très vite.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#050505;
    color:#f5f5f7;
    font-family:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
    text-align:center;
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* Halo rouge venant du haut */
  body::before {
    content:'';
    position:fixed;
    top:-260px;
    left:50%;
    transform:translateX(-50%);
    width:160%;
    max-width:1600px;
    height:900px;
    background:radial-gradient(ellipse at center top,
      rgba(255,60,60,0.30) 0%,
      rgba(255,40,40,0.14) 28%,
      transparent 62%);
    pointer-events:none;
    z-index:0;
    filter:blur(30px);
    animation:redGlow 7s ease-in-out infinite;
  }
  @keyframes redGlow {
    0%,100% { opacity:0.85; transform:translateX(-50%) scale(1); }
    50% { opacity:1; transform:translateX(-50%) scale(1.06); }
  }

  /* Grille de points discrète */
  body::after {
    content:'';
    position:fixed;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:30px 30px;
    pointer-events:none;
    z-index:0;
    mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);
  }

  .wrap {
    position:relative;
    z-index:2;
    max-width:520px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:fadeIn 0.9s ease-out;
  }
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(16px); }
    to { opacity:1; transform:translateY(0); }
  }

  /* LOGO Seek It — rotation d'un coup toutes les 3s */
  .logo {
    width:140px;
    height:140px;
    border-radius:34px;
    background:linear-gradient(135deg, #ffffff 0%, #b8b8c0 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin-bottom:44px;
    box-shadow:
      0 0 80px rgba(255,60,60,0.40),
      0 0 140px rgba(255,40,40,0.18),
      0 0 0 1px rgba(255,255,255,0.06) inset,
      0 24px 48px rgba(0,0,0,0.55);
    animation:logoSpinStep 3s ease-in-out infinite;
  }
  @keyframes logoSpinStep {
    0%   { transform:rotate(0deg) scale(1); }
    15%  { transform:rotate(360deg) scale(1.06); }
    30%  { transform:rotate(360deg) scale(1); }
    100% { transform:rotate(360deg) scale(1); }
  }
  .logo svg {
    width:70px;
    height:70px;
    color:#050505;
    position:relative;
    z-index:1;
  }

  /* TITRE */
  h1 {
    font-size:clamp(2.4rem, 8vw, 3.6rem);
    font-weight:900;
    letter-spacing:-0.04em;
    line-height:1.05;
    margin-bottom:22px;
    color:#ffffff;
    text-shadow:0 0 40px rgba(255,60,60,0.15);
  }
  h1 .accent {
    background:linear-gradient(135deg, #ff5a5a 0%, #ff8080 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }

  /* Sous-titre */
  .desc {
    font-size:1rem;
    color:#9a9aa5;
    line-height:1.6;
    max-width:440px;
    margin-bottom:14px;
    font-weight:400;
  }

  .desc-strong {
    font-size:1.05rem;
    color:#f5f5f7;
    line-height:1.5;
    max-width:460px;
    margin-bottom:42px;
    font-weight:600;
  }

  /* Bouton Discord */
  .discord-btn {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:16px 32px;
    border-radius:14px;
    background:linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%);
    color:#050505;
    font-family:inherit;
    font-size:0.95rem;
    font-weight:700;
    letter-spacing:0.01em;
    text-decoration:none;
    border:1px solid rgba(255,255,255,0.5);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    box-shadow:
      0 10px 28px rgba(0,0,0,0.45),
      0 1px 0 0 rgba(255,255,255,0.6) inset;
    transition:all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .discord-btn::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:50%;
    background:linear-gradient(180deg, rgba(255,255,255,0.6) 0%, transparent 100%);
    border-radius:14px 14px 0 0;
    pointer-events:none;
  }
  .discord-btn:hover {
    transform:translateY(-3px) scale(1.03);
    box-shadow:
      0 20px 48px rgba(88,101,242,0.55),
      0 1px 0 0 rgba(255,255,255,0.6) inset;
  }
  .discord-btn:active {
    transform:translateY(0) scale(0.99);
  }
  .discord-btn svg {
    width:22px;
    height:22px;
    position:relative;
    z-index:1;
    flex-shrink:0;
    color:#5865F2;
  }
  .discord-btn span {
    position:relative;
    z-index:1;
  }

  /* Footer */
  .footer-note {
    margin-top:52px;
    font-size:0.7rem;
    color:#3a3a45;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-weight:500;
  }

  @media (max-width:480px) {
    .logo { width:110px; height:110px; border-radius:28px; margin-bottom:36px; }
    .logo svg { width:56px; height:56px; }
    .discord-btn { width:100%; padding:16px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </div>

  <h1>On <span class="accent">revient.</span></h1>

  <p class="desc">
    Serveur en maintenance à cause d'un datacenter défectueux.
  </p>

  <a class="discord-btn" href="https://discord.gg/GT2C3f6cgQ" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037 13.79 13.79 0 0 0-.617 1.27 18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.626-1.27.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
    </svg>
    <span>.gg/GT2C3f6cgQ</span>
  </a>

  <div class="footer-note">Seek It — Tous droits réservés</div>

</div>

</body>
</html>
