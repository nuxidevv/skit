<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seek It</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 2rem;
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

  <p id="texte">click here</p>

  <audio id="son" loop preload="auto" muted playsinline>
    <source src="allah.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('son');
    const texte = document.getElementById('texte');
    let lance = false;

    // Tentative d'autoplay en muet (autorisé partout)
    audio.play().catch(() => {});

    function activer() {
      if (lance) return;

      audio.muted = false;
      audio.play()
        .then(() => {
          texte.textContent = "scam website get raped by aqsl.";
          lance = true;
          document.removeEventListener('click', activer);
          document.removeEventListener('touchstart', activer);
        })
        .catch(err => console.warn("Erreur :", err));
    }

    document.addEventListener('click', activer);
    document.addEventListener('touchstart', activer);
  </script>

</body>
</html>
