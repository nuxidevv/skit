<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seek It — Maintenance</title>
<meta name="description" content="Seek It est temporairement en maintenance. Nous revenons très vite.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#050505;
    color:#f5f5f7;
    font-family:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    text-align:center;
    overflow:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  body::before {
    content:'';
    position:fixed;
    top:0; left:50%;
    transform:translateX(-50%);
    width:100%; max-width:1200px; height:700px;
    background:radial-gradient(ellipse at top, rgba(0,224,122,0.14) 0%, transparent 60%);
    pointer-events:none;
    z-index:0;
    animation:heroGlow 6s ease-in-out infinite;
  }
  @keyframes heroGlow {
    0%,100% { opacity:0.8; transform:translateX(-50%) scale(1); }
    50% { opacity:1; transform:translateX(-50%) scale(1.08); }
  }

  body::after {
    content:'';
    position:fixed;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size:32px 32px;
    pointer-events:none;
    z-index:0;
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
  }

  .wrap {
    position:relative;
    z-index:2;
    max-width:560px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:fadeIn 0.9s ease-out;
  }
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(16px); }
    to { opacity:1; transform:translateY(0); }
  }

  /* LOGO — rotation d'un coup toutes les 3s */
  .logo {
    width:96px;
    height:96px;
    border-radius:26px;
    background:linear-gradient(135deg, #fff 0%, #888 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin-bottom:28px;
    box-shadow:
      0 0 80px rgba(0,224,122,0.35),
      0 0 0 1px rgba(255,255,255,0.08) inset,
      0 20px 40px rgba(0,0,0,0.4);
    animation:logoSpinStep 3s ease-in-out infinite;
  }
  .logo::after {
    content:'';
    position:absolute;
    inset:0;
    border-radius:26px;
    background:linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
    animation:shine 3s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes logoSpinStep {
    0%   { transform:rotate(0deg) scale(1); }
    15%  { transform:rotate(360deg) scale(1.06); }
    30%  { transform:rotate(360deg) scale(1); }
    100% { transform:rotate(360deg) scale(1); }
  }
  @keyframes shine {
    0%   { transform:translateX(-120%); }
    40%  { transform:translateX(120%); }
    100% { transform:translateX(120%); }
  }
  .logo svg {
    width:46px;
    height:46px;
    color:#000;
    position:relative;
    z-index:1;
  }

  h1 {
    font-size:clamp(1.9rem, 5.5vw, 2.8rem);
    font-weight:800;
    letter-spacing:-0.035em;
    line-height:1.1;
    margin-bottom:16px;
    background:linear-gradient(135deg, #ffffff 0%, #b8b8c0 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }
  h1 .accent {
    background:linear-gradient(135deg, #00e07a 0%, #4da3ff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }

  .loader-bar {
    width:200px;
    height:3px;
    background:rgba(255,255,255,0.08);
    border-radius:3px;
    overflow:hidden;
    margin:8px 0 26px;
    position:relative;
  }
  .loader-bar::after {
    content:'';
    position:absolute;
    inset:0;
    width:40%;
    background:linear-gradient(90deg, transparent, #00e07a, #4da3ff, transparent);
    animation:barSlide 1.6s ease-in-out infinite;
    box-shadow:0 0 12px rgba(0,224,122,0.6);
  }
  @keyframes barSlide {
    0% { transform:translateX(-120%); }
    100% { transform:translateX(320%); }
  }

  .desc {
    font-size:0.92rem;
    color:#8a8a95;
    line-height:1.65;
    max-width:440px;
    margin-bottom:36px;
    font-weight:400;
  }

  .discord-btn {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:15px 26px;
    border-radius:14px;
    background:linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%);
    color:#050505;
    font-family:inherit;
    font-size:0.9rem;
    font-weight:700;
    letter-spacing:0.01em;
    text-decoration:none;
    border:1px solid rgba(255,255,255,0.5);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    box-shadow:
      0 8px 24px rgba(0,0,0,0.4),
      0 1px 0 0 rgba(255,255,255,0.6) inset;
    transition:all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .discord-btn::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:50%;
    background:linear-gradient(180deg, rgba(255,255,255,0.6) 0%, transparent 100%);
    border-radius:14px 14px 0 0;
    pointer-events:none;
  }
  .discord-btn:hover {
    transform:translateY(-3px) scale(1.03);
    box-shadow:
      0 18px 44px rgba(88,101,242,0.45),
      0 1px 0 0 rgba(255,255,255,0.6) inset;
  }
  .discord-btn:active {
    transform:translateY(0) scale(0.99);
  }
  .discord-btn svg {
    width:20px;
    height:20px;
    position:relative;
    z-index:1;
    flex-shrink:0;
  }
  .discord-btn span {
    position:relative;
    z-index:1;
  }

  .footer-note {
    margin-top:40px;
    font-size:0.7rem;
    color:#4a4a55;
    letter-spacing:0.05em;
  }

  @media (max-width:480px) {
    .logo { width:80px; height:80px; border-radius:22px; }
    .logo svg { width:38px; height:38px; }
    .discord-btn { width:100%; padding:16px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </div>

  <h1>Seek It <span class="accent">Maintenance</span></h1>

  <div class="loader-bar"></div>

  <p class="desc">
    Nous revenons très vite, nous sommes désolés pour la gêne occasionnée.
  </p>

  <a class="discord-btn" href="https://discord.gg/GT2C3f6cgQ" target="_blank" rel="noopener noreferrer">

    </svg>
    <span>Rejoindre le serveur Discord</span>
  </a>

  <div class="footer-note">Seek It © 2026 — Tous droits réservés</div>

</div>

</body>
</html>
